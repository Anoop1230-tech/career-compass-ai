# Alembic database migrations. Run from backend/:
#   alembic upgrade head                       apply all migrations
#   alembic revision --autogenerate -m "..."   create a migration after changing models
[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL comes from config.py / .env (DATABASE_URL), never from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s