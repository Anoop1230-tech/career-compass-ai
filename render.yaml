# One-click deploy blueprint for Render (https://render.com).
# Render provides a managed PostgreSQL database and automatic HTTPS (TLS
# certificate + HTTP->HTTPS redirect) for the web service, so no extra
# certificate setup is needed. Adapt the same values for Railway, Fly.io, etc.

databases:
  - name: career-compass-db
    databaseName: career_compass
    plan: free

services:
  - type: web
    name: career-compass
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      # Injected from the managed database above (becomes postgresql+psycopg://...)
      - key: DATABASE_URL
        fromDatabase:
          name: career-compass-db
          property: connectionString
      # Generated once by Render and kept secret; login tokens are signed with it
      - key: SECRET_KEY
        generateValue: true
      # Render's load balancer adds one X-Forwarded-For entry (real visitor IP for rate limits)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Password reset emails: set these in the Render dashboard (kept out of the repo)
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
